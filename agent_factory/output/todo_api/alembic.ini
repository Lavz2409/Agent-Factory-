ini
# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file as
# well as the filename.
# string value is passed to dateutil.tz.gettz()
# leaving it empty will use the system timezone
# timezone =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

[alembic:environment]
# set to 'true' to run the environment in "offline" mode
# offline_mode = false

[alembic:generate]
# set to 'true' to run the environment in "offline" mode
# offline_mode = false

[alembic:compare_type]
# set to 'true' to include type comparison in autogenerate
# compare_type = false

[alembic:compare_server_default]
# set to 'true' to include server default comparison in autogenerate
# compare_server_default = false

[post_write_hooks]
# post_write_hooks =

# [post_write_hooks.<name>]
# hook = some.package:some_function
# args = (arg1, arg2)
# kwargs = {"kwarg1": "value1", "kwarg2": "value2"}

[alembic:sqlite]
# SQLite-specific options.
# use batch mode for all migrations
batch_mode = true